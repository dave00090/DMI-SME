version: '3.8'

services:
  dmi-pos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dmi_business_pos
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Provide your Supabase & Safaricom Daraja credentials below:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - DARAJA_CONSUMER_KEY=${DARAJA_CONSUMER_KEY:-}
      - DARAJA_CONSUMER_SECRET=${DARAJA_CONSUMER_SECRET:-}
      - DARAJA_PASSKEY=${DARAJA_PASSKEY:-}
      - DARAJA_SHORTCODE=${DARAJA_SHORTCODE:-174379}
      - DARAJA_ENVIRONMENT=${DARAJA_ENVIRONMENT:-sandbox}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      # Persist local database snapshots, backups, and vouchers
      - dmi_storage:/app/server_storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/saas/overview"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  dmi_storage:
    driver: local
