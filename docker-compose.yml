      - SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xbXhhZnljdWFkbnF4Z3dsd2FkIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4OTA4MjEzMywiZXhwIjoyMTA0NjU4MTMzfQ.sKRuqmRP82TmByr2_y3_Fg0itP5kLqIFlejgMuw8suU
